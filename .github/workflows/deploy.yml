name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub prove its identity to AWS (OIDC), so no AWS keys are stored here

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skips cleanly until the one-time AWS setup in docs/SETUP.md is done.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy DNS and site
        working-directory: infra
        run: |
          npm ci
          npx cdk deploy ByteatebitsDns ByteatebitsSite --require-approval never
